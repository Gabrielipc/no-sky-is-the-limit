name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.8"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked --no-dev
        working-directory: backend
      - run: uv run --locked python -m unittest discover -s tests -v
        working-directory: backend

  frontend-checks:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.17"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  docker-smoke:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-checks]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: analogos-ci:${{ github.sha }}
      - name: Check image startup, frontend, API, and evidence
        run: |
          set -eu
          docker run --detach --name analogos-ci --publish 127.0.0.1:8000:8000 "analogos-ci:${GITHUB_SHA}"
          cleanup() {
            docker logs analogos-ci || true
            docker rm --force analogos-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/openapi.json >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1

          curl --fail --silent http://127.0.0.1:8000/ | grep -q 'id="root"'
          curl --fail --silent http://127.0.0.1:8000/analysis/terrain.json >/dev/null
          curl --fail --silent http://127.0.0.1:8000/api/scenarios | grep -q 'relieve-regional'
          curl --fail --silent 'http://127.0.0.1:8000/api/scenarios/relieve-regional/comparison?reference_id=mars-jezero-fan&cell_m=60' >/dev/null
          curl --fail --silent http://127.0.0.1:8000/api/regional-search | grep -q 'search_id'
          curl --fail --silent http://127.0.0.1:8000/api/expansion | grep -q 'candidates'
          curl --fail --silent http://127.0.0.1:8000/api/multidimensional | grep -q 'combined_score'
          curl --fail --silent http://127.0.0.1:8000/api/minerals | grep -q 'earth-utah'
          curl --fail --silent http://127.0.0.1:8000/api/minerals/jezero | grep -q 'coverage'
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8000/api/not-a-route)"
          test "$status" = 404

  publish-image:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-checks, docker-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - id: image
        name: Normalize container image name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    name: Deploy production on Azure VM
    runs-on: ubuntu-latest
    needs: publish-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment settings and prepare SSH
        env:
          AZURE_VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          AZURE_VM_USER: ${{ secrets.AZURE_VM_USER }}
          AZURE_VM_SSH_KEY: ${{ secrets.AZURE_VM_SSH_KEY }}
          AZURE_VM_KNOWN_HOSTS: ${{ secrets.AZURE_VM_KNOWN_HOSTS }}
          AZURE_VM_SSH_PORT: ${{ vars.AZURE_VM_SSH_PORT }}
          AZURE_VM_APP_DIR: ${{ vars.AZURE_VM_APP_DIR }}
          AZURE_VM_APP_PORT: ${{ vars.AZURE_VM_APP_PORT }}
          ATLAS_RELEASES_PATH: ${{ vars.ATLAS_RELEASES_PATH }}
        run: |
          set -eu
          for name in AZURE_VM_HOST AZURE_VM_USER AZURE_VM_SSH_KEY AZURE_VM_KNOWN_HOSTS AZURE_VM_APP_DIR ATLAS_RELEASES_PATH; do
            case "$name" in
              AZURE_VM_HOST) value="${AZURE_VM_HOST:-}" ;;
              AZURE_VM_USER) value="${AZURE_VM_USER:-}" ;;
              AZURE_VM_SSH_KEY) value="${AZURE_VM_SSH_KEY:-}" ;;
              AZURE_VM_KNOWN_HOSTS) value="${AZURE_VM_KNOWN_HOSTS:-}" ;;
              AZURE_VM_APP_DIR) value="${AZURE_VM_APP_DIR:-}" ;;
              ATLAS_RELEASES_PATH) value="${ATLAS_RELEASES_PATH:-}" ;;
            esac
            if [ -z "$value" ]; then
              echo "::error::Missing GitHub secret/variable: $name"
              exit 1
            fi
          done
          if ! printf '%s' "$AZURE_VM_APP_DIR" | grep -Eq '^/[A-Za-z0-9._/-]+$'; then
            echo "::error::AZURE_VM_APP_DIR must be a simple absolute path with no spaces or quotes"
            exit 1
          fi
          if ! printf '%s' "$ATLAS_RELEASES_PATH" | grep -Eq '^/[A-Za-z0-9._/-]+$'; then
            echo "::error::ATLAS_RELEASES_PATH must be a simple absolute path with no spaces or quotes"
            exit 1
          fi
          AZURE_VM_SSH_PORT="${AZURE_VM_SSH_PORT:-22}"
          AZURE_VM_APP_PORT="${AZURE_VM_APP_PORT:-8000}"
          printf '%s' "$AZURE_VM_SSH_PORT" | grep -Eq '^[0-9]{1,5}$' || {
            echo "::error::AZURE_VM_SSH_PORT must be a port number"
            exit 1
          }
          printf '%s' "$AZURE_VM_APP_PORT" | grep -Eq '^[0-9]{1,5}$' || {
            echo "::error::AZURE_VM_APP_PORT must be a port number"
            exit 1
          }
          if [ "$AZURE_VM_SSH_PORT" -lt 1 ] || [ "$AZURE_VM_SSH_PORT" -gt 65535 ] \
            || [ "$AZURE_VM_APP_PORT" -lt 1 ] || [ "$AZURE_VM_APP_PORT" -gt 65535 ]; then
            echo "::error::SSH and application ports must be between 1 and 65535"
            exit 1
          fi
          printf '%s' "$AZURE_VM_USER" | grep -Eq '^[A-Za-z0-9._-]+$' || {
            echo "::error::AZURE_VM_USER contains unsupported characters"
            exit 1
          }
          printf '%s' "$AZURE_VM_HOST" | grep -Eq '^[A-Za-z0-9.-]+$' || {
            echo "::error::AZURE_VM_HOST must be an IP address or DNS name"
            exit 1
          }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$AZURE_VM_SSH_KEY" > "$HOME/.ssh/azure_vm_key"
          printf '%s\n' "$AZURE_VM_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/azure_vm_key" "$HOME/.ssh/known_hosts"
          echo "AZURE_VM_SSH_PORT=$AZURE_VM_SSH_PORT" >> "$GITHUB_ENV"
          echo "AZURE_VM_APP_PORT=$AZURE_VM_APP_PORT" >> "$GITHUB_ENV"
      - name: Copy Compose file and runtime settings
        env:
          AZURE_VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          AZURE_VM_USER: ${{ secrets.AZURE_VM_USER }}
          AZURE_VM_SSH_PORT: ${{ vars.AZURE_VM_SSH_PORT }}
          AZURE_VM_APP_PORT: ${{ vars.AZURE_VM_APP_PORT }}
          AZURE_VM_APP_DIR: ${{ vars.AZURE_VM_APP_DIR }}
          ATLAS_RELEASES_PATH: ${{ vars.ATLAS_RELEASES_PATH }}
          IMAGE: ${{ needs.publish-image.outputs.image }}:sha-${{ github.sha }}
        run: |
          set -eu
          AZURE_VM_SSH_PORT="${AZURE_VM_SSH_PORT:-22}"
          AZURE_VM_APP_PORT="${AZURE_VM_APP_PORT:-8000}"
          target="$AZURE_VM_USER@$AZURE_VM_HOST"
          ssh_options=(-i "$HOME/.ssh/azure_vm_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -p "$AZURE_VM_SSH_PORT")
          ssh "${ssh_options[@]}" "$target" "mkdir -p '$AZURE_VM_APP_DIR'"

          chmod 600 "$HOME/.ssh/azure_vm_key"
          scp -i "$HOME/.ssh/azure_vm_key" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -P "$AZURE_VM_SSH_PORT" deploy/docker-compose.yml \
            "$target:$AZURE_VM_APP_DIR/docker-compose.yml"

          umask 077
          {
            printf 'IMAGE=%s\n' "$IMAGE"
            printf 'APP_PORT=%s\n' "${AZURE_VM_APP_PORT:-8000}"
            printf 'ATLAS_RELEASES_PATH=%s\n' "$ATLAS_RELEASES_PATH"
          } > "$RUNNER_TEMP/compose.env"
          scp -i "$HOME/.ssh/azure_vm_key" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -P "$AZURE_VM_SSH_PORT" "$RUNNER_TEMP/compose.env" \
            "$target:$AZURE_VM_APP_DIR/.env"
          ssh "${ssh_options[@]}" "$target" "chmod 600 '$AZURE_VM_APP_DIR/.env'"
      - name: Pull and start the production image
        env:
          AZURE_VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          AZURE_VM_USER: ${{ secrets.AZURE_VM_USER }}
          AZURE_VM_SSH_PORT: ${{ vars.AZURE_VM_SSH_PORT }}
          AZURE_VM_APP_DIR: ${{ vars.AZURE_VM_APP_DIR }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          set -eu
          AZURE_VM_SSH_PORT="${AZURE_VM_SSH_PORT:-22}"
          : "${GHCR_USERNAME:?Missing GitHub secret GHCR_USERNAME}"
          : "${GHCR_PULL_TOKEN:?Missing GitHub secret GHCR_PULL_TOKEN}"
          printf '%s' "$GHCR_USERNAME" | grep -Eq '^[A-Za-z0-9-]+$' || {
            echo "::error::GHCR_USERNAME contains unsupported characters"
            exit 1
          }
          target="$AZURE_VM_USER@$AZURE_VM_HOST"
          ssh_options=(-i "$HOME/.ssh/azure_vm_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -p "$AZURE_VM_SSH_PORT")
          printf '%s' "$GHCR_PULL_TOKEN" | ssh "${ssh_options[@]}" "$target" \
            "set -eu; cd '$AZURE_VM_APP_DIR'; docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin; trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT; docker compose --env-file .env -f docker-compose.yml pull; docker compose --env-file .env -f docker-compose.yml run --rm --no-deps --entrypoint python app -c \"from pathlib import Path; p=Path('/workspace/releases/atlas30/.write-test'); p.touch(); p.unlink()\"; docker compose --env-file .env -f docker-compose.yml up -d --remove-orphans --wait; docker logout ghcr.io >/dev/null; trap - EXIT"
