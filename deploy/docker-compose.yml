services:
  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    image: regolith-backend:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - "${ATLAS_RELEASES_PATH:-./releases}:/workspace/releases/atlas30"
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: regolith-frontend:latest
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
