[project]
name = "analogos-backend"
version = "0.1.0"
description = "API del prototipo de análogos planetarios"
requires-python = ">=3.9"
dependencies = [
    "duckdb>=1.4,<3",
    "fastapi>=0.100,<1",
    "joblib>=1.3,<2",
    "numpy>=1.26,<3",
    "pyarrow>=15",
    "pydantic>=2.7,<3",
    "rasterio>=1.3,<2",
    "scikit-learn>=1.4,<2",
    "scipy>=1.11,<2",
    "uvicorn[standard]>=0.23,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2,<3",
]

[tool.uv]
package = false
